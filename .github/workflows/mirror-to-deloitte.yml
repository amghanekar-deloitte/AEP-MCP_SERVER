name: Mirror to Deloitte Org

on:
  push:
    branches: ["**"]
    tags: ["**"]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + all refs)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH
        env:
          DELOITTE_SSH_KEY: ${{ secrets.DELOITTE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DELOITTE_SSH_KEY" > ~/.ssh/id_deloitte
          chmod 600 ~/.ssh/id_deloitte
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          {
            echo "Host github-work"
            echo "  HostName github.com"
            echo "  User git"
            echo "  IdentityFile ~/.ssh/id_deloitte"
            echo "  IdentitiesOnly yes"
          } >> ~/.ssh/config

      - name: Push mirror to Deloitte org
        run: |
          git push git@github-work:Deloitte-US-Consulting/AEP_MCP_SERVER.git --mirror
